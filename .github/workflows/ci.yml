name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check nexus/static/app.js
      - name: Browser regression tests
        run: |
          python -m playwright install --with-deps chromium
          python tests/ui_smoke_runner.py
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt -f json -o artifacts/dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: artifacts/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexuschat:ci .
      - name: Verify isolated container health
        run: |
          docker run -d --name nexus-ci --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8300:8300 -v nexus-ci-data:/opt/nexuschat/data nexuschat:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8300/ready; then exit 0; fi
            sleep 2
          done
          docker logs nexus-ci
          exit 1
  reporting-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-owner-only
          POSTGRES_DB: reporting
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-owner-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: reporting
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pci-owner-only" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-owner-only
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: reporting
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Real read-only reporting connections
        env:
          NEXUS_DB_INTEGRATION: disposable-ci
        run: python -m pytest -q tests/test_database_services.py
