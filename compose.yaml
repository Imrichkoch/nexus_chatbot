services:
  nexus:
    build: .
    image: nexuschat:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8300:8300"
    volumes:
      - nexus-data:/opt/nexuschat/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 30s
volumes:
  nexus-data:
